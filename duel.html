<!doctype html>
<html lang="en">
<head>
<title>Duel Arena</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&display=swap">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/examples/jsm/": "./vendor/three/jsm/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d24; touch-action: none; -webkit-user-select: none; user-select: none; font-family: 'Lilita One', system-ui, sans-serif; color: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bars { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 12px; right: 12px; display: flex; gap: 10px; pointer-events: none; }
  .bar { flex: 1; pointer-events: auto; } .bar.r { text-align: right; }
  /* the team colour: tap a side's bar to change it (the swatch says what it is now) */
  .sw { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; vertical-align: -6px; margin: 0 6px; box-shadow: 0 2px 0 #000a; }
  .sw.orig { background: conic-gradient(#e0402a, #f2a020, #3fcf5a, #2ec8e0, #3a62f0, #b050f0, #e0402a) !important; } /* as painted */
  .bar b { font-family: 'Bungee', sans-serif; font-size: 15px; letter-spacing: 1px; text-shadow: 0 2px 0 #000; }
  .hp { height: 14px; border-radius: 7px; background: #00000080; border: 2px solid #fff; overflow: hidden; margin-top: 3px; }
  .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(#ffd75a, #f28c28); transition: width .25s; }
  .bar.r .hp i, .bar.r .gd i { margin-left: auto; }
  .gd { height: 5px; border-radius: 3px; background: #00000080; margin-top: 3px; overflow: hidden; } .gd i { display: block; height: 100%; background: #9fe0ff; transition: width .15s; }
  .bar.win b { color: #ffd75a; }
  .dock { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 10px; }
  .dock button { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; background: #2a2d38e0; color: #fff; display: grid; place-items: center; padding: 0; font: inherit; box-shadow: 0 4px 0 #0008; }
  .dock button svg { width: 26px; height: 26px; margin-top: 6px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dock button small { font-family: 'Bungee', sans-serif; font-size: 8px; margin-top: -10px; letter-spacing: .5px; }
  .dock button.pick { width: 84px; border-radius: 32px; }
  .dock button.pick b { font-family: 'Bungee', sans-serif; font-size: 11px; }
  .dock button.on { color: #ffd75a; border-color: #ffd75a; }
  /* YOU mode: a stick appears under the left thumb; two big buttons for the right */
  #stick, #rstick { position: fixed; z-index: 3; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 3px solid #ffffff80; background: #ffffff18; pointer-events: none; }
  #stick i, #rstick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 #0008; }
  body.you .dock button:not(#you):not(#home) { display: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; font-family: 'Bungee', sans-serif; font-size: 18px; background: #1b1d24; }
  #err { position: fixed; left: 10px; right: 10px; top: 60px; background: #a01818; padding: 8px; font: 12px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bars"><div class="bar" id="barA"><i class="sw" id="swA"></i><b id="nameA"></b><div class="hp"><i id="hpA"></i></div><div class="gd"><i id="gdA"></i></div></div><div class="bar r" id="barB"><b id="nameB"></b><i class="sw" id="swB"></i><div class="hp"><i id="hpB"></i></div><div class="gd"><i id="gdB"></i></div></div></div>
<div class="dock">
  <button type="button" id="home" aria-label="Back to the game"><span data-i="home"></span><small>MENU</small></button>
  <button type="button" class="pick" id="pickA" aria-label="Left fighter"><b></b></button>
  <button type="button" id="fight" aria-label="Fight"><span data-i="play"></span><small>FIGHT</small></button>
  <button type="button" class="pick" id="pickB" aria-label="Right fighter"><b></b></button>
  <button type="button" id="size" aria-label="How many a side"><span data-i="people"></span><small>1V1</small></button>
  <button type="button" id="slow" aria-label="Slow motion"><span data-i="pause"></span><small>SLOW</small></button>
  <button type="button" id="view" aria-label="Side view"><span data-i="eye"></span><small>VIEW</small></button>
  <button type="button" id="you" aria-label="Play the left fighter yourself"><span data-i="hero"></span><small>YOU</small></button>
</div>
<div id="stick" hidden><i id="knob"></i></div>
<div id="rstick" hidden><i id="rknob"></i></div>
<div id="load">LOADING</div>
<div id="err" hidden></div>
<script>
  // a phone has no console: show boot errors on the page
  addEventListener('error', (e) => { const el = document.getElementById('err'); el.hidden = false; el.textContent += (e.message || e) + '\n'; });
  addEventListener('unhandledrejection', (e) => { const el = document.getElementById('err'); el.hidden = false; el.textContent += String(e.reason && (e.reason.stack || e.reason)) + '\n'; });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
<script type="module" src="./src/duel/duel.js?v=197"></script>
</body>
</html>
