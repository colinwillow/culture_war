<!doctype html>
<html lang="en">
<head>
<title>Culture Wars Greybox</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&display=swap">
<link rel="stylesheet" href="./src/ui/style.css?v=207">
<!-- No build step needed: GitHub Pages serves this file straight from main, so bare 'three' imports resolve here. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/examples/jsm/": "./vendor/three/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="chip" id="cash"><span class="ic" data-i="coin"></span><b>600</b></div>
  <div class="chip" id="cp"><span class="ic" data-i="people"></span><b>0/50</b></div>
  <div class="chip meter"><i id="meterFill"></i><span class="ic" data-i="star"></span></div>
  <div class="chip heatc" id="heatChip" style="display:none"><span class="ic" data-i="siren"></span><div class="hb"><i id="heatBar"></i></div></div>
  <div class="chip hillc" id="hillChip" style="display:none"><span class="ic" data-i="flag"></span><div class="hb"><i id="hillMe"></i><i id="hillThem"></i></div></div>
</div>
<div id="danger"></div>
<canvas id="mini"></canvas>
<button type="button" id="pauseBtn" aria-label="Pause"><span class="ic" data-i="pause"></span></button>
<div id="pauseDim" hidden><span class="ic" data-i="play"></span><button type="button" id="quitBtn" class="again" aria-label="Quit to menu"><span class="ic" data-i="home"></span></button><button type="button" id="speedBtn" class="again" aria-label="Game speed"></button></div>
<button type="button" id="muteBtn" aria-label="Sound"></button>
<button type="button" id="gfxBtn" aria-label="Graphics"></button>
<button type="button" id="globeBtn" aria-label="Globe look"></button>
<a id="duelBtn" href="./duel.html" aria-label="Duel arena"></a>
<button type="button" id="alert" aria-label="Under attack" hidden></button>
<div id="placeBar" hidden>
  <button type="button" class="btn noCost ok" id="placeOk" aria-label="Place building"><span class="ic" data-i="check"></span></button>
  <button type="button" class="btn noCost close" id="placeNo" aria-label="Cancel"><span class="ic" data-i="x"></span></button>
</div>
<div id="tip" hidden></div>
<div id="dock"><div id="queue"></div><div id="panel"></div><div id="cmd"></div></div>
<div id="box"></div>
<div id="holdRing" hidden></div>
<div id="menu" class="overlay">
  <h1>Culture <em>Wars</em><span>GREYBOX 04 · <b id="build">B207</b></span></h1>
  <div class="diff" id="diff"><button type="button" data-d="0" aria-label="Easy"><span class="ic" data-i="star"></span></button><button type="button" data-d="1" class="on" aria-label="Normal"><span class="ic" data-i="star"></span><span class="ic" data-i="star"></span></button><button type="button" data-d="2" aria-label="Hard"><span class="ic" data-i="star"></span><span class="ic" data-i="star"></span><span class="ic" data-i="star"></span></button><i class="sep"></i><button type="button" class="mode" data-m="vs" aria-label="Versus"><span class="ic" data-i="home"></span><small>VERSUS</small></button><button type="button" class="mode" data-m="hill" aria-label="King of the Hill"><span class="ic" data-i="flag"></span><small>HILL</small></button><button type="button" class="mode" data-m="cap" aria-label="Capture and Hold"><span class="ic" data-i="hold"></span><small>FLAGS</small></button><button type="button" class="mode" data-m="race" aria-label="Resource Race"><span class="ic" data-i="coin"></span><small>RACE</small></button><button type="button" class="mode" data-m="hero" aria-label="Hero vs Hero"><span class="ic" data-i="hero"></span><small>HEROES</small></button><button type="button" class="mode" data-m="down-w" aria-label="Downtown: you smash the city"><span class="ic" data-i="ball"></span><small>SMASH</small></button><button type="button" class="mode" data-m="down-b" aria-label="Downtown: you keep the city standing"><span class="ic" data-i="hammer"></span><small>FIX</small></button><i class="sep"></i><button type="button" class="mode arena" id="arenaBtn" aria-label="Duel arena: the alien fighters"><span class="ic" data-i="shield"></span><small>ARENA</small></button><button type="button" class="mode arena" id="hexBtn" aria-label="Hex city map prototype"><span class="ic" data-i="tower"></span><small>HEX</small></button></div>
  <div class="picks">
    <button class="pick" data-f="bw" type="button"><span class="ic" data-i="truck"></span>Backwoods<small>FEWER · TOUGHER</small></button>
    <button class="pick" data-f="ac" type="button"><span class="ic" data-i="megaphone"></span>Activists<small>MORE · FASTER</small></button>
    <button class="pick" data-f="hh" type="button"><span class="ic" data-i="hardhat"></span>Hard Hats<small>BUILD · DIG IN</small></button>
    <button class="pick" data-f="om" type="button"><span class="ic" data-i="coin"></span>Old Money<small>FEW · ELITE</small></button>
    <button class="pick" data-f="sc" type="button"><span class="ic" data-i="music"></span>Street Crew<small>FAST · HYPE</small></button>
    <button class="pick" data-f="nd" type="button"><span class="ic" data-i="wifi"></span>Nerds<small>RANGE · TECH</small></button>
  </div>
</div>
<div id="end" class="overlay" hidden>
  <div class="big" id="endIcon"></div>
  <div id="vsRow"></div>
  <div id="stats"></div>
  <div class="endBtns"><button class="again" id="again" type="button" aria-label="Menu"><span class="ic" data-i="home"></span></button><button class="again" id="rematch" type="button" aria-label="Rematch"><span class="ic" data-i="replay"></span></button></div>
</div>
<div id="bootErr" hidden></div>
<div id="devInfo" hidden></div>
<script>
// No console on a phone: if the game script fails to start, print why on the menu instead of leaving dead buttons.
(function () {
  var box = document.getElementById('bootErr');
  function show(msg) { box.hidden = false; box.textContent += msg + '\n'; }
  window.addEventListener('error', function (e) { show('ERROR ' + e.message + (e.filename ? ' @ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('ERROR ' + (e.reason && e.reason.message || e.reason)); });
  window.__cwLoadFail = function () { show('ERROR could not load src/main.js'); };
  setTimeout(function () { if (!window.__cwBooted) show('Game script did not start (old cached file? wait a few minutes and reload)'); }, 8000);
})();
</script>
<script type="module" src="./src/main.js?v=207" onerror="__cwLoadFail()"></script>
</body>
</html>
